name: Daily Website Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: read
  issues: read

jobs:
  daily-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: website-watch-state-${{ github.run_id }}
          restore-keys: |
            website-watch-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Run daily website watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python -m github_watch --state data/state.json --screenshots data/screenshots

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: website-watch-state-${{ github.run_id }}
