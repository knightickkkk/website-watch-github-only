[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "website-watch-github-only"
version = "0.1.0"
description = "GitHub Pages + Issues + Actions website change alerts with screenshot emails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.46,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
